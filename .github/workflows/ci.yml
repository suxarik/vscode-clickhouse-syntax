name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Lint & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: matrix.node == '20'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  integration:
    name: Integration (real ClickHouse)
    runs-on: ubuntu-latest
    needs: test

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        ports:
          - 18123:8123
        env:
          CLICKHOUSE_SKIP_USER_SETUP: 1
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for ClickHouse
        run: |
          for i in $(seq 1 40); do
            curl -sf http://localhost:18123/ping && exit 0
            sleep 2
          done
          echo "ClickHouse did not come up" && exit 1

      # VS Code needs a display, even headless.
      - name: Run integration tests
        run: xvfb-run -a npm run test:integration
        env:
          CLICKHOUSE_TEST_URL: http://localhost:18123

  package:
    name: Bundle & Package
    runs-on: ubuntu-latest
    needs: [test, integration]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle
        run: npm run package:bundle

      - name: Package extension (.vsix)
        run: npx @vscode/vsce package --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: clickhouse-syntax.vsix
          path: '*.vsix'
          retention-days: 7
